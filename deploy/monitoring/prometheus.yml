# Prometheus scrape config for the Quick Snap VPS.
#
# Four targets:
#   quicksnap     — the Django app's own metrics (see snap/metrics.py)
#   node          — the VPS itself: CPU, memory, disk, network, load
#   cadvisor      — per-container resource use, incl. neighbour services
#   prometheus    — self-monitoring, so you can tell if scraping itself broke
#
# 15s is frequent enough to watch a live event without generating much data.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: german-vps

# Alert rules live in their own file so promtool can validate them
# independently. See deploy/monitoring/alerts.yml.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: quicksnap
    # Scrape the app directly over the compose network. Do NOT use
    # host.docker.internal:8010 — that alias does not resolve on this Linux
    # host, and bouncing out to the host loopback and back in is pointless when
    # both containers already share a network.
    #
    # Django validates the Host header against ALLOWED_HOSTS and would answer
    # 400 for "web"; settings.py appends the internal service name so this
    # works without a manual step on the VPS.
    static_configs:
      - targets: ["web:8000"]
    # /metrics is token-gated (it exposes guest counts and event slugs), so the
    # scrape authenticates. deploy.sh writes this file from METRICS_TOKEN and
    # chowns it to uid 65534, the user the prometheus image runs as.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    scrape_timeout: 10s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
