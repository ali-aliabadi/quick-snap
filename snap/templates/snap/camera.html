<!DOCTYPE html>
<html lang="{{ lang }}" dir="{% if rtl %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <!-- Browser pinch-zoom stays off here on purpose: this page handles pinch
       itself to drive the camera's zoom, and a zoomed *page* would break the
       fixed viewfinder layout. Every other page allows pinch-zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{ event.name }} — {{ t.site_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Space+Mono:wght@400;700&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --film-black:#17110D; --safelight:#F0A63A; --shutter:#D63B24;
      --ivory:#F3EAD9; --muted:#A08A72; --sprocket:#0E0A07;
      --ui:"Space Mono",monospace;
    }
    /* Persian needs Vazirmatn — Space Mono has no Persian glyphs, so without
       this the whole viewfinder UI falls back to a default system font. */
    html[dir="rtl"] { --ui:"Vazirmatn",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100dvh; background:#000; overflow:hidden;
      font-family:var(--ui); -webkit-text-size-adjust:100%;
      overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
    /* Video + zoom: the preview fills the screen and can be scaled for zoom.
       The transform-origin stays center so pinch-to-zoom feels natural.

       pointer-events:none is load-bearing: on iOS a <video> is tappable and a
       stray tap pauses it, leaving the guest staring at a frozen viewfinder
       with no obvious way back. Taps must fall through to the page (which is
       also where the pinch handler lives). */
    #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000;
      transform-origin:center; transition:transform .08s ease-out;
      pointer-events:none; }
    #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }
    #flash.fire { animation:flash .18s ease-out; }
    @keyframes flash { 0%{opacity:.92} 100%{opacity:0} }

    /* film-frame corner brackets — you're shooting *inside* a frame */
    .brackets { position:fixed; inset:0; pointer-events:none; }
    .brackets::before, .brackets::after,
    .brackets > i::before, .brackets > i::after {
      content:""; position:absolute; width:26px; height:26px;
      border:2px solid rgba(243,234,217,.55);
    }
    .brackets::before { top:calc(env(safe-area-inset-top) + 76px); left:20px; border-right:0; border-bottom:0; }
    .brackets::after  { top:calc(env(safe-area-inset-top) + 76px); right:20px; border-left:0; border-bottom:0; }
    .brackets > i::before { bottom:150px; left:20px; border-right:0; border-top:0; }
    .brackets > i::after  { bottom:150px; right:20px; border-left:0; border-top:0; }

    /* --- Exposure counter window: the signature. A lit mechanical readout. --- */
    #counter {
      position:fixed; top:calc(env(safe-area-inset-top) + 16px); left:50%; transform:translateX(-50%);
      display:flex; align-items:baseline; gap:8px;
      background:rgba(14,10,7,.72); border:1px solid rgba(240,166,58,.45);
      border-radius:3px; padding:8px 16px; backdrop-filter:blur(8px);
      box-shadow:0 0 18px rgba(240,166,58,.18);
    }
    #counter .num { font-size:1.55rem; font-weight:700; color:var(--safelight);
      font-variant-numeric:tabular-nums; line-height:1; text-shadow:0 0 10px rgba(240,166,58,.5);
      display:inline-block; }
    #counter .num.tick { animation:count-tick .35s cubic-bezier(.2,.8,.2,1); }
    @keyframes count-tick {
      0%{ transform:translateY(-.5em) scale(1.35); opacity:.2; }
      60%{ transform:translateY(.06em) scale(1); opacity:1; }
      100%{ transform:none; }
    }
    #counter .lab { font-size:.62rem; letter-spacing:.24em; color:var(--muted); text-transform:uppercase; }

    #endcd {
      position:fixed; top:calc(env(safe-area-inset-top) + 62px); left:50%; transform:translateX(-50%);
      font-size:.68rem; letter-spacing:.16em; color:rgba(243,234,217,.82); text-transform:uppercase;
      text-shadow:0 1px 3px rgba(0,0,0,.8); font-variant-numeric:tabular-nums;
    }
    #endcd:empty { display:none; }

    /* Camera flip button mirrors sides in RTL */
    #switch {
      position:absolute; right:28px; bottom:calc(env(safe-area-inset-bottom) + 47px);
      width:52px; height:52px; border-radius:50%;
      background:rgba(14,10,7,.72); color:var(--ivory); border:1px solid rgba(243,234,217,.22);
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      backdrop-filter:blur(8px); transition:transform .15s, background .15s;
    }
    html[dir="rtl"] #switch { right:auto; left:28px; }
    /* display:flex above would defeat the `hidden` attribute on its own. */
    #switch[hidden] { display:none; }
    #switch:active { transform:scale(.92); background:rgba(14,10,7,.9); }
    #switch svg { width:24px; height:24px; }

    /* Zoom readout. Pinch is the gesture — this is only the indicator, exactly
       like the phone camera app: it appears while you're zooming and fades out
       after. Tapping it snaps back to 1x. It is NOT a slider; a slider on a
       viewfinder means one thumb is busy holding a control instead of framing.
       Hidden at 1x so the default view is uncluttered. */
    #zoom-pill {
      position:fixed; left:50%; transform:translateX(-50%) scale(.85);
      bottom:calc(env(safe-area-inset-bottom) + 158px);
      min-width:56px; padding:7px 15px; border-radius:100px;
      background:rgba(14,10,7,.72); border:1px solid rgba(240,166,58,.45);
      color:var(--safelight); backdrop-filter:blur(8px);
      font-family:var(--ui); font-size:.9rem; font-weight:700; line-height:1;
      font-variant-numeric:tabular-nums; text-align:center; cursor:pointer;
      opacity:0; pointer-events:none; user-select:none;
      box-shadow:0 0 18px rgba(240,166,58,.18);
      transition:opacity .2s, transform .2s;
    }
    /* .live = actively pinching, .held = lingering after the gesture ends */
    #zoom-pill.live, #zoom-pill.held {
      opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto;
    }
    #zoom-pill:active { transform:translateX(-50%) scale(.92); }

    .controls {
      position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column;
      align-items:center; gap:14px; padding-bottom:calc(env(safe-area-inset-bottom) + 34px);
    }
    .shutter-row {
      display:flex; align-items:center; justify-content:center;
    }
    /* Shutter release: white ring + white fill — the universal *photo* button.
       Deliberately NOT red: a red circle reads as "recording video", and guests
       kept asking whether this app was filming them. */
    #snap {
      width:78px; height:78px; border-radius:50%; padding:0; cursor:pointer;
      background:transparent; border:3px solid rgba(243,234,217,.9);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 0 5px rgba(0,0,0,.3);
      transition:transform .07s;
    }
    /* the inner disc is the "film" — solid ivory, like every phone camera */
    #snap::after {
      content:""; width:60px; height:60px; border-radius:50%;
      background:var(--ivory);
      box-shadow:inset 0 -2px 6px rgba(0,0,0,.18);
      transition:transform .07s, background .15s;
    }
    #snap:active { transform:scale(.94); }
    #snap:active::after { transform:scale(.88); }
    #snap.recoil { animation:recoil .28s cubic-bezier(.2,.8,.2,1); }
    @keyframes recoil { 0%{ transform:scale(.9); } 55%{ transform:scale(1.05); } 100%{ transform:scale(1); } }
    #snap:disabled { border-color:rgba(243,234,217,.3); }
    #snap:disabled::after { background:#6b5c50; }
    #hint { color:rgba(243,234,217,.72); font-size:.64rem; letter-spacing:.22em;
      text-transform:uppercase; text-shadow:0 1px 3px rgba(0,0,0,.7); text-align:center;
      padding:0 24px; font-family:var(--ui); }
    html[dir="rtl"] #hint { letter-spacing:0; text-transform:none; font-size:.8rem; }

    /* Gallery picker — mirrors the flip button on the opposite side */
    #gallery {
      position:absolute; left:28px; bottom:calc(env(safe-area-inset-bottom) + 47px);
      width:52px; height:52px; border-radius:50%;
      background:rgba(14,10,7,.72); color:var(--ivory); border:1px solid rgba(243,234,217,.22);
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      backdrop-filter:blur(8px); transition:transform .15s, background .15s; padding:0;
    }
    html[dir="rtl"] #gallery { left:auto; right:28px; }
    #gallery:active { transform:scale(.92); background:rgba(14,10,7,.9); }
    #gallery svg { width:23px; height:23px; }
    #gallery:disabled { opacity:.45; }
    #file { display:none; }

    /* gate + overlay share the darkroom look */
    #gate, #overlay {
      position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
      justify-content:center; gap:12px; padding:32px; text-align:center;
      background:radial-gradient(120% 90% at 50% 0%, rgba(240,166,58,.08), transparent 55%), rgba(23,17,13,.94);
      backdrop-filter:blur(10px); color:var(--ivory);
    }
    #gate.show, #overlay.show { display:flex; }
    #gate-msg, #overlay-msg { font-family:"Fraunces",serif; font-weight:500; font-size:1.35rem; }
    #gate-cd { font-size:2.4rem; font-weight:700; color:var(--safelight);
      font-variant-numeric:tabular-nums; text-shadow:0 0 16px rgba(240,166,58,.4);
      animation:gate-pulse 1.8s ease-in-out infinite; }
    @keyframes gate-pulse { 0%,100%{ opacity:.72; } 50%{ opacity:1; text-shadow:0 0 26px rgba(240,166,58,.7); } }
    #overlay-retry { margin-top:12px; padding:13px 26px; border:0; border-radius:3px;
      background:var(--safelight); color:#1A120A; font-family:var(--ui);
      font-weight:700; letter-spacing:.16em; text-transform:uppercase; font-size:.82rem; }
    html[dir="rtl"] #overlay-retry { letter-spacing:0; text-transform:none; }
    /* --- Sending overlay: a developing photo, with a live progress ring --- */
    #sending {
      position:fixed; inset:0; z-index:20; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:22px;
      background:radial-gradient(120% 90% at 50% 42%, rgba(23,17,13,.72), rgba(9,6,4,.9));
      backdrop-filter:blur(6px);
    }
    #sending.show { display:flex; }
    .ring { position:relative; width:150px; height:150px; }
    .ring svg { position:absolute; inset:0; width:100%; height:100%; }
    .ring circle { fill:none; }

    /* Outer decorative spinner — always rotating, hard and mechanical. */
    .ring .spin-svg { animation:ringspin .85s linear infinite; }
    .ring .spin {
      stroke:var(--shutter); stroke-width:4; stroke-linecap:round;
      stroke-dasharray:70 380; stroke-dashoffset:0;
      filter:drop-shadow(0 0 5px rgba(214,59,36,.6));
    }
    @keyframes ringspin { to { transform:rotate(360deg); } }

    /* Inner progress ring — fills like a bar as bytes upload. */
    .ring .prog-svg { transform:rotate(-90deg); }
    .ring .track { stroke:rgba(243,234,217,.12); stroke-width:7; }
    .ring .prog {
      stroke:var(--safelight); stroke-width:7; stroke-linecap:round;
      stroke-dasharray:326.726; stroke-dashoffset:326.726;
      filter:drop-shadow(0 0 6px rgba(240,166,58,.55));
      transition:stroke-dashoffset .25s ease;
    }
    /* Before the upload starts (capturing/encoding), the progress ring is
       empty and the % is hidden — only the outer spinner shows motion. */
    #sending.indeterminate .ring .prog { transition:none; }
    #sending.indeterminate .ring .pct { opacity:0; }

    .ring .pct {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      gap:1px; color:var(--ivory); font-weight:700; font-size:2rem;
      font-variant-numeric:tabular-nums; text-shadow:0 0 12px rgba(240,166,58,.4);
      transition:opacity .2s;
    }
    .ring .pct i { font-style:normal; font-size:.9rem; color:var(--muted); align-self:flex-start; margin-top:8px; }
    .send-label {
      font-size:.68rem; letter-spacing:.28em; text-transform:uppercase; color:var(--muted);
      font-family:var(--ui);
    }
    html[dir="rtl"] .send-label { letter-spacing:0; text-transform:none; font-size:.84rem; }

    /* Time remaining, under the ring. Deliberately quiet — it's reassurance,
       not the main event, and it must not jitter as the estimate settles. */
    #eta {
      margin-top:-12px; min-height:1.2em; color:rgba(243,234,217,.6);
      font-family:var(--ui); font-size:.78rem; letter-spacing:.04em;
      font-variant-numeric:tabular-nums; text-align:center;
    }
    /* Cancel: a way out of a stalled upload on venue wifi. Understated so it
       never competes with the progress ring, but a full-size tap target. */
    #cancel-upload {
      margin-top:6px; padding:12px 26px; min-height:44px;
      border-radius:100px; cursor:pointer;
      background:transparent; border:1px solid rgba(243,234,217,.3);
      color:rgba(243,234,217,.82); font-family:var(--ui);
      font-size:.78rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
      transition:background .15s, border-color .15s, transform .1s, opacity .15s;
    }
    html[dir="rtl"] #cancel-upload { letter-spacing:0; text-transform:none; font-size:.9rem; }
    #cancel-upload:active { transform:scale(.96); background:rgba(243,234,217,.1); }
    #cancel-upload:disabled { opacity:.35; cursor:default; }
    html[dir="rtl"] #counter .lab { letter-spacing:0; text-transform:none; font-size:.72rem; }
    html[dir="rtl"] #endcd { letter-spacing:0; text-transform:none; font-size:.76rem; }

    @media (prefers-reduced-motion:reduce) {
      #snap, #flash, #counter .num, #gate-cd, #video, #zoom-pill { transition:none; animation:none; }
    }
  </style>
</head>
<body
  data-capture-url="{% url 'snap:capture' event.slug %}"
  data-done-url="{% url 'snap:done' event.slug %}"
  data-join-url="{% url 'snap:join' event.slug %}"
  data-remaining="{{ remaining }}"
  data-start="{{ event.start_at|date:'c' }}"
  data-end="{{ event.end_at|date:'c' }}"
  data-lang="{{ lang }}"
  data-t-closes="{{ t.cd_closes }}"
  data-t-gate="{{ t.gate_opens }}"
  data-t-camerr="{{ t.cam_err }}"
  data-t-uperr="{{ t.upload_err }}"
  data-t-etacalc="{{ t.eta_calc }}"
  data-t-etasecs="{{ t.eta_secs }}"
  data-t-etamin="{{ t.eta_min }}"
  data-t-etamins="{{ t.eta_mins }}"
  data-t-etafin="{{ t.eta_finishing }}"
  data-t-cancelled="{{ t.upload_cancelled }}">

  <!-- disablepictureinpicture / controlslist keep iOS from offering PiP or a
       control overlay on long-press; a viewfinder is not a media player. -->
  <video id="video" playsinline autoplay muted
         disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"
         tabindex="-1"></video>
  <div id="flash"></div>
  <div class="brackets"><i></i></div>

  <div id="counter"><span class="num">0</span><span class="lab">{{ t.exp_left }}</span></div>
  <div id="endcd"></div>

  <!-- Zoom readout. Pinch anywhere on the preview drives it; tap to reset. -->
  <button id="zoom-pill" type="button" aria-label="{{ t.zoom }}" title="{{ t.zoom }}">1x</button>

  <div class="controls">
    <div class="shutter-row">
      <button id="snap" type="button" aria-label="Take photo"></button>
    </div>
    <div id="hint">{{ t.tap_expose }}</div>
    <button id="gallery" type="button" aria-label="{{ t.gallery }}" title="{{ t.gallery }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <!-- No `capture` attribute: that would force the camera and defeat the
         whole point of letting guests pick an existing photo. -->
    <input type="file" id="file" accept="image/*">
    <!-- Hidden until a successful getUserMedia proves there's a second camera:
         device labels and ids are withheld before permission, so we cannot know
         the camera count up front. -->
    <button id="switch" type="button" hidden aria-label="{{ t.flip }}" title="{{ t.flip }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 8a8 8 0 00-14-3M4 5v3h3"/>
        <path d="M4 16a8 8 0 0014 3M20 19v-3h-3"/>
      </svg>
    </button>
  </div>

  <div id="sending">
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52"></circle>
        <circle class="prog" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="pct"><span id="pct-num">0</span><i>%</i></div>
    </div>
    <div class="send-label">{{ t.cam_sending }}</div>
    <!-- aria-live so the estimate is announced as it settles, but politely -->
    <div id="eta" aria-live="polite">{{ t.eta_calc }}</div>
    <button id="cancel-upload" type="button">{{ t.cancel }}</button>
  </div>

  <div id="gate">
    <div id="gate-msg">{{ t.gate_opens }}</div>
    <div id="gate-cd"></div>
  </div>

  <div id="overlay">
    <div id="overlay-msg">{{ t.cam_err }}</div>
    <button id="overlay-retry" type="button">{{ t.retry }}</button>
  </div>

  <canvas id="canvas" hidden></canvas>

  {% csrf_token %}
  <script>
  (function () {
    const body = document.body;
    const CAPTURE_URL = body.dataset.captureUrl;
    const DONE_URL = body.dataset.doneUrl;
    const JOIN_URL = body.dataset.joinUrl;
    let remaining = parseInt(body.dataset.remaining, 10);
    const startAt = body.dataset.start ? new Date(body.dataset.start) : null;
    const endAt = body.dataset.end ? new Date(body.dataset.end) : null;
    const fa = body.dataset.lang === "fa";
    const T = {
      closes: body.dataset.tCloses, gate: body.dataset.tGate,
      camErr: body.dataset.tCamerr, upErr: body.dataset.tUperr,
      etaCalc: body.dataset.tEtacalc, etaSecs: body.dataset.tEtasecs,
      etaMin: body.dataset.tEtamin, etaMins: body.dataset.tEtamins,
      etaFin: body.dataset.tEtafin, cancelled: body.dataset.tCancelled,
    };
    const faDigit = s => fa ? s.replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]) : s;
    let facing = "environment";
    let stream = null;
    let track = null;
    let imageCapture = null;
    let busy = false;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const snap = document.getElementById("snap");
    const galleryBtn = document.getElementById("gallery");
    const fileInput = document.getElementById("file");
    const flash = document.getElementById("flash");
    const counterNum = document.querySelector("#counter .num");
    const endcd = document.getElementById("endcd");
    const gate = document.getElementById("gate");
    const gateCd = document.getElementById("gate-cd");
    const sending = document.getElementById("sending");
    const ringProg = document.querySelector("#sending .ring .prog");
    const pctNum = document.getElementById("pct-num");
    const overlay = document.getElementById("overlay");
    const overlayMsg = document.getElementById("overlay-msg");
    const zoomPill = document.getElementById("zoom-pill");
    const switchBtn = document.getElementById("switch");
    const etaEl = document.getElementById("eta");
    const cancelBtn = document.getElementById("cancel-upload");
    const csrf = document.querySelector("input[name=csrfmiddlewaretoken]").value;

    /* ---------------------------------------------------------------- *
     *  Zoom. Two mechanisms, one logical scale (`zoom`, 1 = no zoom):
     *
     *  1. Optical/sensor zoom via the MediaStreamTrack `zoom` constraint
     *     (Android Chrome). Best quality — the sensor does the work, so
     *     the captured still is zoomed with no pixels thrown away.
     *  2. Digital zoom fallback (iOS Safari has no `zoom` constraint):
     *     scale the preview with CSS and crop the *same* region when
     *     encoding, so the saved photo matches what the guest framed.
     *
     *  MAX_DIGITAL is deliberately low — digital zoom is a centre crop,
     *  so pushing past ~3x visibly softens a wedding photo.
     * ---------------------------------------------------------------- */
    const MAX_DIGITAL = 3;
    let zoom = 1;                 // logical zoom the guest sees
    let zoomMax = MAX_DIGITAL;    // upper bound for this camera
    let zoomCaps = null;          // native {min,max,step} when supported
    let zoomPending = false;      // rAF throttle for applyConstraints

    function readZoomCaps() {
      zoomCaps = null;
      zoomMax = MAX_DIGITAL;
      if (!track || !track.getCapabilities) return;
      let caps = {};
      try { caps = track.getCapabilities() || {}; } catch (e) { return; }
      if (caps.zoom && typeof caps.zoom.max === "number" && caps.zoom.max > caps.zoom.min) {
        zoomCaps = caps.zoom;
        // Native zoom ranges are in device units (often 1..8, sometimes 100..400).
        // Express everything as a multiple of the minimum so the label reads "2.0x".
        zoomMax = Math.min(8, caps.zoom.max / caps.zoom.min);
      }
    }

    /* Native zoom is a device-unit value; logical 1 maps to caps.zoom.min. */
    function nativeZoomFor(z) {
      const span = zoomCaps.max - zoomCaps.min;
      const frac = (z - 1) / (zoomMax - 1);
      let v = zoomCaps.min + span * Math.max(0, Math.min(1, frac));
      if (zoomCaps.step) v = Math.round(v / zoomCaps.step) * zoomCaps.step;
      return Math.max(zoomCaps.min, Math.min(zoomCaps.max, v));
    }

    /* Is the current camera front-facing? Once we're cycling by deviceId,
       `facing` is just what we *asked* for and may not be what we got, so
       trust the track's own report and only fall back to the request. */
    function isFrontFacing() {
      const s = track && track.getSettings ? track.getSettings() : {};
      if (s.facingMode) return s.facingMode === "user";
      return facing === "user";
    }

    function applyMirror() { applyZoom(); }   // zoom owns the transform

    function applyZoom() {
      const mirror = isFrontFacing() ? " scaleX(-1)" : "";
      if (zoomCaps) {
        // Sensor zoom: preview needs no CSS scale, the frames arrive zoomed.
        video.style.transform = mirror.trim() || "none";
        if (!zoomPending) {
          zoomPending = true;
          requestAnimationFrame(() => {
            zoomPending = false;
            if (!track) return;
            track.applyConstraints({ advanced: [{ zoom: nativeZoomFor(zoom) }] })
              .catch(() => { /* device refused; preview stays put */ });
          });
        }
      } else {
        // Digital zoom: scale the preview, crop to match at encode time.
        video.style.transform = "scale(" + zoom + ")" + mirror;
      }
      renderZoom();
    }

    function renderZoom() {
      zoomPill.textContent = faDigit(zoom.toFixed(1)) + "x";
      zoomPill.setAttribute("aria-valuenow", zoom.toFixed(1));
    }

    function setZoom(z) {
      const next = Math.max(1, Math.min(zoomMax, z));
      if (Math.abs(next - zoom) < 0.001) return;
      zoom = next;
      applyZoom();
    }

    function resetZoom() {
      zoom = 1;
      applyZoom();
    }

    /* --- Zoom readout visibility ---
       .live while the fingers are down, then .held for a moment after, so the
       final value is readable before it fades. Never shown at 1x. */
    let pillHideTimer = null;

    function showPill(live) {
      clearTimeout(pillHideTimer);
      if (zoom <= 1.001) {                 // back to wide: nothing to report
        zoomPill.classList.remove("live", "held");
        return;
      }
      zoomPill.classList.toggle("live", !!live);
      zoomPill.classList.add("held");
      if (!live) pillHideTimer = setTimeout(() => zoomPill.classList.remove("held"), 1400);
    }

    zoomPill.addEventListener("click", () => { resetZoom(); showPill(false); });

    /* --- Pinch: the gesture people already know from the camera app ---
       Tracked continuously against the distance at gesture start, so zoom
       follows the fingers 1:1 and survives a finger being lifted and replaced
       (that restarts the baseline rather than jumping). */
    let pinchStartDist = 0;
    let pinchStartZoom = 1;

    function touchDist(t) {
      return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    }

    document.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinchStartDist = touchDist(e.touches);
        pinchStartZoom = zoom;
        showPill(true);
      }
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        e.preventDefault();   // don't let the browser try to pan/zoom the page
        setZoom(pinchStartZoom * (touchDist(e.touches) / pinchStartDist));
        showPill(true);
      }
    }, { passive: false });

    function endPinch(e) {
      if (e.touches.length >= 2) return;
      if (pinchStartDist > 0) showPill(false);
      pinchStartDist = 0;
      // A finger still down? Re-baseline so the next pinch doesn't jump.
      if (e.touches.length === 1) pinchStartZoom = zoom;
    }
    document.addEventListener("touchend", endPinch, { passive: true });
    document.addEventListener("touchcancel", endPinch, { passive: true });

    /* Desktop/trackpad: wheel (and trackpad pinch, which arrives as ctrl+wheel). */
    document.addEventListener("wheel", (e) => {
      if (busy) return;
      e.preventDefault();
      setZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08));
      showPill(false);
    }, { passive: false });

    function fmt(ms) {
      let s = Math.max(0, Math.floor(ms / 1000));
      const d = Math.floor(s / 86400); s -= d * 86400;
      const h = Math.floor(s / 3600); s -= h * 3600;
      const m = Math.floor(s / 60); s -= m * 60;
      const p = n => String(n).padStart(2, "0");
      return faDigit((d > 0 ? d + "d " : "") + p(h) + ":" + p(m) + ":" + p(s));
    }

    function started() { return !startAt || new Date() >= startAt; }
    function ended() { return endAt && new Date() > endAt; }

    function renderCounter(animate) {
      const next = faDigit(String(remaining).padStart(2, "0"));
      if (animate && next !== counterNum.textContent) {
        counterNum.classList.remove("tick");
        void counterNum.offsetWidth;   // restart the animation
        counterNum.classList.add("tick");
      }
      counterNum.textContent = next;
    }

    function tickClocks() {
      const now = new Date();
      if (startAt && now < startAt) {
        gate.classList.add("show");
        document.getElementById("gate-msg").textContent = T.gate;
        gateCd.textContent = fmt(startAt - now);
        snap.disabled = true;
        galleryBtn.disabled = true;
      } else {
        gate.classList.remove("show");
        if (!busy && !ended()) { snap.disabled = false; galleryBtn.disabled = false; }
      }
      if (endAt) {
        if (ended()) { window.location = DONE_URL; return; }
        endcd.textContent = T.closes + " " + fmt(endAt - now);
      }
    }

    /* `kind` decides what Retry does: restart the camera for a camera fault,
       or just dismiss for a failed upload (the camera is fine — retrying it
       would pointlessly tear the preview down). */
    let overlayKind = "camera";

    function showOverlay(msg, showRetry, kind) {
      overlayKind = kind || "camera";
      overlayMsg.textContent = msg;
      document.getElementById("overlay-retry").style.display = showRetry ? "" : "none";
      overlay.classList.add("show");
    }

    /* ---------------------------------------------------------------- *
     *  Camera acquisition.
     *
     *  `facingMode` is a mobile-only mechanism. Firefox desktop derives it
     *  from string-matching the OS camera label, so an ordinary webcam
     *  reports nothing and a facingMode flip silently does nothing. And on
     *  Firefox Android a non-exact constraint can hand back the camera that
     *  already holds permission — i.e. the one you're trying to flip away
     *  from. So we ask by exact deviceId whenever we know one, and keep
     *  facingMode only as the mobile fast path.
     *
     *  Rungs, in order, stopping at the first that yields a stream:
     *    1. deviceId exact  — the only form that reliably defeats Firefox's
     *                         permission grace period
     *    2. facingMode exact — reliable on iOS/Android; its failure on
     *                          desktop is the signal to cycle deviceIds
     *    3. facingMode ideal — desktop browsers ignore it rather than throw
     *    4. bare video:true  — a guest with a fixed roll must always get
     *                          *a* camera rather than an error overlay
     * ---------------------------------------------------------------- */
    const QUALITY = { width: { ideal: 4096 }, height: { ideal: 2160 }, frameRate: { ideal: 30 } };

    let videoInputs = [];      // cached; only meaningful after a successful gUM
    let deviceIdx = -1;        // position in videoInputs when cycling by id
    let useDeviceCycle = false; // true once we know facingMode is meaningless
    let activeDeviceId = null; // camera on screen now, so a restart can restore it

    async function tryGum(videoConstraints) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: Object.assign({}, QUALITY, videoConstraints),
          audio: false,
        });
      } catch (e) {
        return null;
      }
    }

    /* Device labels/ids are hidden until a getUserMedia has succeeded, so this
       can only ever run *after* we hold a stream — never before. */
    async function refreshDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const all = await navigator.mediaDevices.enumerateDevices();
        videoInputs = all.filter(d => d.kind === "videoinput" && d.deviceId);
      } catch (e) { /* keep whatever we had */ }
      // Only offer the flip when there's somewhere to flip *to*.
      switchBtn.hidden = videoInputs.length < 2 && !supportsFacing();
    }

    function supportsFacing() {
      const sc = navigator.mediaDevices.getSupportedConstraints
        ? navigator.mediaDevices.getSupportedConstraints() : {};
      if (!sc.facingMode) return false;
      // Supported *and* actually populated: desktop reports undefined here.
      const s = track && track.getSettings ? track.getSettings() : {};
      return !!s.facingMode;
    }

    async function startCamera(targetDeviceId) {
      overlay.classList.remove("show");
      // Firefox Android needs the old camera fully released before the new one
      // is requested, or the second acquisition fails.
      if (stream) stream.getTracks().forEach(t => t.stop());
      track = null; imageCapture = null;

      stream = (targetDeviceId && await tryGum({ deviceId: { exact: targetDeviceId } }))
            || (!useDeviceCycle && await tryGum({ facingMode: { exact: facing } }))
            || (!useDeviceCycle && await tryGum({ facingMode: { ideal: facing } }))
            || await tryGum({});

      if (!stream) { showOverlay(T.camErr, true, "camera"); return; }

      video.srcObject = stream;
      track = stream.getVideoTracks()[0];

      // Did we actually get the facing we asked for? If the browser can't
      // report facing at all, flipping has to go through deviceIds instead.
      if (!supportsFacing()) useDeviceCycle = true;

      // Best-effort focus/exposure hints (ignored where unsupported).
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        const adv = [];
        if (caps.focusMode && caps.focusMode.includes("continuous")) adv.push({ focusMode: "continuous" });
        if (caps.exposureMode && caps.exposureMode.includes("continuous")) adv.push({ exposureMode: "continuous" });
        if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes("continuous")) adv.push({ whiteBalanceMode: "continuous" });
        if (adv.length) await track.applyConstraints({ advanced: adv });
      } catch (e) { /* focus hints are optional */ }

      // ImageCapture gives us a full-resolution still (not the downscaled
      // preview frame). Feature-detected; we fall back to the canvas path.
      if (window.ImageCapture && track) {
        try { imageCapture = new ImageCapture(track); } catch (e) { imageCapture = null; }
      }

      // A new track means new zoom limits (front cameras usually have none).
      readZoomCaps();
      resetZoom();
      applyMirror();

      await refreshDevices();
      // Keep the cycle index pointing at whatever we're actually showing, and
      // remember the id so a restart (iOS kills the stream on background) can
      // come back on the *same* camera instead of reverting to the default.
      const nowId = track.getSettings ? track.getSettings().deviceId : null;
      if (nowId) {
        activeDeviceId = nowId;
        const i = videoInputs.findIndex(d => d.deviceId === nowId);
        if (i >= 0) deviceIdx = i;
      }

      // iOS sometimes leaves the element paused despite autoplay.
      try { await video.play(); } catch (e) { /* preview will start on its own */ }
    }

    /* Flip. On a phone that reports facing, toggle it. Everywhere else —
       Firefox desktop especially — advance through the camera list by id. */
    async function flipCamera() {
      if (busy) return;
      if (useDeviceCycle && videoInputs.length > 1) {
        deviceIdx = (deviceIdx + 1) % videoInputs.length;
        await startCamera(videoInputs[deviceIdx].deviceId);
      } else {
        facing = facing === "environment" ? "user" : "environment";
        await startCamera();
      }
    }

    // Cameras appearing/disappearing (docking, external webcam) changes whether
    // the flip button has anywhere to go.
    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener("devicechange", () => { refreshDevices(); });
    }

    /* ---------------------------------------------------------------- *
     *  Encode settings — chosen by measuring real photos off the VPS,
     *  not by rule of thumb. Mean size per photo, and PSNR against a
     *  same-size lossless reference (>40 dB = visually indistinguishable):
     *
     *    jpeg 3840 q94   3.71 MB   44.2 dB   <- what this used to ship
     *    webp 2560 q86   0.91 MB   39.0 dB   <- borderline, rejected
     *    webp 2560 q90   1.03 MB   40.7 dB   <- chosen: 3.6x smaller
     *
     *  2560px is ~4.9 MP: comfortably past any screen and fine for a
     *  6x4 or 5x7 print. Photos upload ~3.6x faster on the same wifi,
     *  which on a bad venue connection is the difference between a
     *  guest waiting and a guest giving up.
     * ---------------------------------------------------------------- */
    const MAX_EDGE = 2560;
    const JPEG_Q = 0.94;         // fallback path (no WebP encoder)
    const WEBP_Q = 0.90;
    const TAKEPHOTO_MS = 3500;   // ImageCapture can hang; bail to canvas fast
    const UPLOAD_MS = 45000;     // generous — the ring shows real progress

    /* Which format can this browser actually *encode*?
       canvas.toBlob only guarantees PNG: ask for an unsupported type and the
       callback still fires, handing back a PNG. A PNG of a 2560px photo is
       ~10 MB — three times worse than the JPEG we are replacing — so we probe
       for real and check the blob's own type rather than trusting the request
       or sniffing versions. Detected once at startup. */
    let encodeType = "image/jpeg";
    let encodeQuality = JPEG_Q;

    async function detectEncodeFormat() {
      try {
        const probe = document.createElement("canvas");
        probe.width = probe.height = 8;
        const blob = await new Promise(r => probe.toBlob(r, "image/webp", WEBP_Q));
        if (blob && blob.type === "image/webp") {
          encodeType = "image/webp";
          encodeQuality = WEBP_Q;
        }
      } catch (e) { /* stay on JPEG */ }
    }

    /* Extension must match the bytes: the host downloads these as a ZIP and a
       .jpg that is really WebP will not open in some viewers. */
    function encodeExt() { return encodeType === "image/webp" ? "webp" : "jpg"; }

    function withTimeout(promise, ms, label) {
      let timer;
      const guard = new Promise((_, rej) => {
        timer = setTimeout(() => rej(new Error(label || "timeout")), ms);
      });
      return Promise.race([promise, guard]).finally(() => clearTimeout(timer));
    }

    /* Encode `source` to a blob in whatever format this browser supports
       (WebP where available, JPEG otherwise — see detectEncodeFormat).
       `crop` > 1 takes a centre crop of that factor first — this is how digital
       zoom reaches the saved file. Without it the guest would frame a zoomed
       shot and get back the full wide frame. Sensor zoom passes crop = 1,
       because those frames arrive already zoomed. */
    function encode(source, sw, sh, mirror, crop) {
      const z = Math.max(1, crop || 1);
      const cw = sw / z, ch = sh / z;            // source rect we actually keep
      const cx = (sw - cw) / 2, cy = (sh - ch) / 2;
      const scale = Math.min(1, MAX_EDGE / Math.max(cw, ch));
      const dw = Math.max(1, Math.round(cw * scale));
      const dh = Math.max(1, Math.round(ch * scale));
      canvas.width = dw; canvas.height = dh;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";  // sharper downscale from sensor res
      if (mirror) { ctx.translate(dw, 0); ctx.scale(-1, 1); }
      ctx.drawImage(source, cx, cy, cw, ch, 0, 0, dw, dh);
      return new Promise(r => canvas.toBlob(r, encodeType, encodeQuality));
    }

    /* Digital zoom needs a matching crop at capture time; sensor zoom doesn't. */
    function captureCrop() { return zoomCaps ? 1 : zoom; }

    async function grabBlob() {
      const mirror = isFrontFacing();
      const crop = captureCrop();
      // Preferred: full-resolution still from the sensor — but time-boxed,
      // because takePhoto() stalls on some devices. Falls back to the frame.
      if (imageCapture) {
        try {
          const shot = await withTimeout(imageCapture.takePhoto(), TAKEPHOTO_MS, "takephoto");
          if (shot && shot.size > 0) {
            const bmp = await createImageBitmap(shot);
            const out = await encode(bmp, bmp.width, bmp.height, mirror, crop);
            if (bmp.close) bmp.close();
            return out;
          }
        } catch (e) { /* fall through to the reliable canvas path */ }
      }
      // Reliable path: the current preview frame at its native resolution.
      return encode(video, video.videoWidth, video.videoHeight, mirror, crop);
    }

    const RING_LEN = 326.726;  // 2·π·52 — must match the SVG circle radius

    function setProgress(pct) {
      // pct null => indeterminate (spinning); number => determinate ring.
      if (pct == null) {
        ringProg.style.strokeDashoffset = RING_LEN * 0.75;
        sending.classList.add("indeterminate");
        pctNum.textContent = "";
      } else {
        sending.classList.remove("indeterminate");
        const p = Math.max(0, Math.min(100, pct));
        ringProg.style.strokeDashoffset = RING_LEN * (1 - p / 100);
        pctNum.textContent = faDigit(String(Math.round(p)));
      }
    }

    /* ---------------------------------------------------------------- *
     *  Time remaining.
     *
     *  Venue wifi is bursty, so instantaneous rate is far too jumpy to show
     *  a guest — the number would flicker between "2s" and "40s". We hold an
     *  exponential moving average of bytes/sec and only *lower* the displayed
     *  estimate unless the truth is much worse, so the countdown reads as a
     *  countdown rather than a random number generator.
     *
     *  Seconds is the right unit: a ~2-4 MB JPEG on hotel wifi is a handful
     *  of seconds. Minutes only appear when it's genuinely that bad.
     * ---------------------------------------------------------------- */
    let etaRate = 0;        // smoothed bytes/sec
    let etaLastT = 0;
    let etaLastLoaded = 0;
    let etaShown = null;    // last seconds value we displayed

    function etaReset() {
      etaRate = 0; etaLastT = 0; etaLastLoaded = 0; etaShown = null;
      etaEl.textContent = T.etaCalc;
    }

    function etaUpdate(loaded, total) {
      const now = performance.now();
      if (!etaLastT) { etaLastT = now; etaLastLoaded = loaded; return; }

      const dt = (now - etaLastT) / 1000;
      if (dt < 0.25) return;                  // too soon to say anything useful
      const dBytes = loaded - etaLastLoaded;

      // Stalled: bytes stopped moving. Say so rather than let the last estimate
      // stand — a frozen "2s left" on a dead connection is worse than silence.
      if (dBytes <= 0) {
        if (dt >= 2) { etaEl.textContent = T.etaCalc; etaShown = null; }
        return;                               // keep the baseline; don't skew the average
      }

      etaLastT = now; etaLastLoaded = loaded;
      const sample = dBytes / dt;
      // First sample seeds the average; later ones ease it 30% toward the truth.
      etaRate = etaRate ? etaRate * 0.7 + sample * 0.3 : sample;
      if (etaRate <= 0) return;

      const secs = Math.ceil((total - loaded) / etaRate);
      // Hold the number steady against small upward corrections so it reads as
      // a countdown, but let a genuinely worse estimate (>=3s) through.
      if (etaShown != null && secs > etaShown && secs - etaShown < 3) return;
      etaShown = secs;
      etaEl.textContent = etaText(secs, loaded / total);
    }

    /* `frac` guards the "finishing" wording: on a fast link the arithmetic says
       ~1s while half the photo is still in flight, and claiming we're finishing
       at 50% reads as a stuck progress bar. */
    function etaText(secs, frac) {
      if (secs <= 1) return frac >= 0.9 ? T.etaFin : T.etaSecs.replace("{n}", faDigit("1"));
      if (secs < 60) return T.etaSecs.replace("{n}", faDigit(String(secs)));
      const mins = Math.round(secs / 60);
      return mins <= 1 ? T.etaMin : T.etaMins.replace("{n}", faDigit(String(mins)));
    }

    // XHR upload so we can report real bytes-sent progress (fetch cannot).
    // The live xhr is tracked so Cancel can abort it.
    let activeXhr = null;

    function uploadBlob(blob) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        activeXhr = xhr;
        xhr.open("POST", CAPTURE_URL, true);
        xhr.setRequestHeader("X-CSRFToken", csrf);
        xhr.timeout = UPLOAD_MS;
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            setProgress((e.loaded / e.total) * 100);
            etaUpdate(e.loaded, e.total);
          }
        };
        xhr.upload.onload = () => {
          setProgress(100);              // bytes done; server still working
          etaEl.textContent = T.etaFin;
        };
        xhr.onload = () => { activeXhr = null; resolve({ status: xhr.status, text: xhr.responseText }); };
        xhr.onerror = () => { activeXhr = null; reject(new Error("network")); };
        xhr.ontimeout = () => { activeXhr = null; reject(new Error("timeout")); };
        // abort() fires onabort, not onerror — surface it as its own reason so
        // submitBlob knows not to auto-retry a deliberate cancel.
        xhr.onabort = () => { activeXhr = null; reject(new Error("aborted")); };
        const fd = new FormData();
        // Filename extension must match the actual bytes — Django derives the
        // stored file's extension from it, and the host's ZIP would otherwise
        // contain WebP data labelled .jpg.
        fd.append("image", blob, "snap." + encodeExt());
        xhr.send(fd);
      });
    }

    /* Cancel. The roll is only decremented when the server commits the photo,
       so aborting costs the guest nothing — the exposure is still theirs.

       The flag matters as much as the abort: the overlay goes up *before* any
       XHR exists (takePhoto() can spend up to TAKEPHOTO_MS, then a 4K JPEG
       encode), so for the first moments there is nothing to abort. Setting the
       flag makes those phases bail at their next checkpoint, so the button
       always does something rather than looking enabled and ignoring taps. */
    let cancelled = false;

    function cancelUpload() {
      if (cancelled) return;
      cancelled = true;
      cancelBtn.disabled = true;
      // Abort if bytes are already moving; otherwise the checkpoints below
      // (in takePhoto / usePickedFile / submitBlob) pick it up.
      if (activeXhr) activeXhr.abort();
    }

    cancelBtn.addEventListener("click", cancelUpload);

    /* Throw at a phase boundary if the guest hit Cancel. Same Error message the
       XHR abort produces, so every caller can treat cancels uniformly. */
    function abortIfCancelled() {
      if (cancelled) throw new Error("aborted");
    }

    function setBusy(on) {
      busy = on;
      snap.disabled = on;
      galleryBtn.disabled = on;
    }

    /* Upload one blob and reconcile the roll counter. Shared by the live
       shutter and the gallery picker so both consume the same roll. */
    async function submitBlob(blob) {
      abortIfCancelled();         // cancelled while we were encoding
      setProgress(0);             // start of upload
      etaReset();

      // One automatic retry on network blip or timeout — but never after a
      // deliberate cancel, which would resurrect the upload the guest killed.
      let res;
      try {
        res = await uploadBlob(blob);
      } catch (e) {
        if (cancelled || e.message === "aborted") throw e;
        setProgress(null);        // indeterminate while retrying
        etaReset();
        res = await uploadBlob(blob);
      }

      if (res.status === 409) { window.location = DONE_URL; return; }
      if (res.status === 403) {
        let d = {};
        try { d = JSON.parse(res.text); } catch (e) {}
        if (d.error === "ended" || d.error === "closed") { window.location = DONE_URL; return; }
        // Session expired mid-event (8h cap) — send them back to re-enter their
        // number, which resumes the same roll. Without this the shutter just
        // silently stopped working.
        if (d.error === "not_joined") { window.location = JOIN_URL; return; }
        tickClocks();
        return;
      }
      if (res.status < 200 || res.status >= 300) throw new Error("upload failed");
      const data = JSON.parse(res.text);
      remaining = data.remaining;
      renderCounter(true);
      if (data.done) { window.location = DONE_URL; return; }
    }

    async function takePhoto() {
      if (busy || remaining <= 0 || !stream) return;
      if (!started() || ended()) return;
      setBusy(true);

      flash.classList.remove("fire"); void flash.offsetWidth; flash.classList.add("fire");
      snap.classList.remove("recoil"); void snap.offsetWidth; snap.classList.add("recoil");
      setProgress(null);            // capturing / encoding: indeterminate
      sending.classList.add("show");

      try {
        const blob = await grabBlob();
        abortIfCancelled();     // cancelled during takePhoto()/encode
        await submitBlob(blob);
      } catch (e) {
        // A cancel is the guest's own decision — tell them plainly that the
        // photo wasn't saved, rather than implying something broke.
        showOverlay(wasCancelled(e) ? T.cancelled : T.upErr, true, "upload");
      } finally {
        endSending();
      }
    }

    function wasCancelled(e) { return cancelled || (e && e.message === "aborted"); }

    /* Tear down the sending overlay and re-arm the shutter. Always paired with
       a show, including on the cancel path, or the guest is stuck behind it. */
    function endSending() {
      sending.classList.remove("show");
      cancelled = false;
      cancelBtn.disabled = false;
      activeXhr = null;
      setBusy(false);
    }

    /* Decode a picked file, honouring EXIF orientation.
       createImageBitmap ignores EXIF by default, so a photo shot in portrait
       uploads sideways. `imageOrientation:"from-image"` fixes that where it's
       supported; the <img> fallback covers older Safari and formats
       createImageBitmap can't decode (e.g. HEIC), which browsers happily let
       through `accept="image/*"`. */
    async function decodeImage(file) {
      if (window.createImageBitmap) {
        try {
          const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
          return { src: bmp, w: bmp.width, h: bmp.height, release: () => bmp.close && bmp.close() };
        } catch (e) { /* fall through to the <img> path */ }
      }
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const el = new Image();
          el.onload = () => resolve(el);
          el.onerror = () => reject(new Error("decode"));
          el.src = url;
        });
        // <img> applies EXIF orientation itself, so drawing it is already upright.
        return {
          src: img,
          w: img.naturalWidth,
          h: img.naturalHeight,
          release: () => URL.revokeObjectURL(url),
        };
      } catch (e) {
        URL.revokeObjectURL(url);
        throw e;
      }
    }

    /* Gallery pick: re-encode through the same canvas path as a live shot so
       huge originals get scaled/compressed identically, then upload. Counts
       against the roll exactly like a snap — the server enforces the cap. */
    async function usePickedFile(file) {
      if (busy || remaining <= 0 || !file) return;
      if (!started() || ended()) return;
      setBusy(true);
      setProgress(null);
      sending.classList.add("show");

      let decoded = null;
      try {
        decoded = await decodeImage(file);
        abortIfCancelled();   // decoding a large HEIC/JPEG is slow enough to cancel during
        // No mirror and no crop: a gallery photo is already framed as the
        // guest wants it — the live preview's zoom has nothing to do with it.
        const blob = await encode(decoded.src, decoded.w, decoded.h, false, 1);
        await submitBlob(blob);
      } catch (e) {
        showOverlay(wasCancelled(e) ? T.cancelled : T.upErr, true, "upload");
      } finally {
        if (decoded) decoded.release();
        endSending();
      }
    }

    snap.addEventListener("click", takePhoto);
    galleryBtn.addEventListener("click", () => { if (!busy) fileInput.click(); });
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";   // let the same file be picked again later
      if (file) usePickedFile(file);
    });
    switchBtn.addEventListener("click", flipCamera);
    document.getElementById("overlay-retry").addEventListener("click", () => {
      if (overlayKind === "upload") { overlay.classList.remove("show"); return; }
      restartCamera();
    });

    /* Rebuild the stream on the camera the guest was actually using.
       Bare startCamera() re-runs the acquisition ladder from the top, which on
       a deviceId-cycled camera silently lands back on the default one — so
       backgrounding the app could flip you from the back camera to the front
       mid-roll. Passing the remembered id keeps that from happening. */
    function restartCamera() { return startCamera(activeDeviceId || undefined); }

    /* Backgrounding the tab suspends the camera on iOS and the preview comes
       back frozen. If the track died while we were away, rebuild the stream. */
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible" || busy) return;
      if (!stream || !track || track.readyState === "ended") { restartCamera(); return; }
      video.play().catch(() => { /* nothing more we can do */ });
    });

    /* The viewfinder must never sit paused. iOS pauses the element on its own
       for things we don't control (PiP attempts, audio-session interruptions,
       long-press menus), and a frozen preview looks identical to a crashed
       app. Whatever caused it, resume — unless the track is actually dead, in
       which case rebuild the whole stream instead. */
    video.addEventListener("pause", () => {
      if (document.visibilityState !== "visible") return;   // legitimately backgrounded
      if (!track || track.readyState === "ended") { restartCamera(); return; }
      video.play().catch(() => {});
    });

    renderCounter();
    renderZoom();
    tickClocks();
    if (startAt || endAt) setInterval(tickClocks, 1000);
    // Probe the encoder before the camera, so the very first shutter press
    // already knows which format to produce. It is an 8x8 canvas — instant.
    detectEncodeFormat().then(startCamera);
  })();
  </script>
</body>
</html>
